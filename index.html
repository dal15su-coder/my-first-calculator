<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff3f9">
  <title>나의 첫 번째 계산기</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid;
      place-items: center; padding: 20px 12px; background: #eff3f9;
      color: #192c48; font-family: system-ui, sans-serif; }
    main { width: min(100%, 390px); background: white; padding: 24px;
      border-radius: 26px; box-shadow: 0 16px 48px #20345614; }
    .tag { font-size: 12px; letter-spacing: .12em; color: #536b8b; margin: 0 0 10px; }
    h1 { font-size: clamp(21px, 6vw, 27px); margin: 0 0 24px; }
    .screen { padding: 18px; border-radius: 16px; background: #f1f5fa; }
    #expression { min-height: 22px; color: #536b8b; font-size: 14px; overflow-wrap: anywhere; }
    output { display: block; text-align: right; font-size: clamp(22px, 7vw, 32px);
      font-variant-numeric: tabular-nums; overflow-wrap: anywhere; margin-top: 8px; }
    #message { min-height: 44px; margin: 14px 0; font-size: 13px; line-height: 1.6; color: #536b8b; }
    #message.error { color: #b12838; }
    .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    button { min-height: 60px; border: 0; border-radius: 14px; font: inherit;
      font-size: 23px; color: #192c48; background: #f0f3f8; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.95); filter: brightness(.93); }
    button:focus-visible { outline: 3px solid #315fc4; outline-offset: 2px; }
    .operator { background: #e3ecff; color: #254c9b; }
    .clear { background: #ffe7e7; color: #a93140; }
    .equals { background: #315fc4; color: white; }
    .zero { grid-column: span 2; }
    footer { text-align: center; font-size: 12px; color: #536b8b; margin-top: 20px; }
    @media (max-width: 340px) { main { padding: 16px; } .keys { gap: 6px; } }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <p class="tag">MY FIRST CALCULATOR</p>
    <h1 id="title">나의 첫 번째 계산기</h1>
    <div class="screen">
      <div id="expression" aria-label="진행 중인 연산"></div>
      <output id="display" aria-label="입력 및 계산 결과" aria-live="polite">0</output>
    </div>
    <p id="message" role="status">숫자 → 연산 → 숫자 → = 순서로 눌러 보세요.</p>
    <div class="keys" aria-label="계산기 버튼">
      <button class="clear" data-key="C" aria-label="전체 초기화">C</button>
      <button data-key="backspace" aria-label="마지막 숫자 지우기">⌫</button>
      <button class="operator" data-key="÷" aria-label="나누기">÷</button>
      <button class="operator" data-key="×" aria-label="곱하기">×</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="operator" data-key="-" aria-label="빼기">−</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="operator" data-key="+" aria-label="더하기">+</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="." aria-label="소수점">.</button>
      <button class="zero" data-key="0">0</button>
      <button data-key="sign" aria-label="양수 음수 바꾸기">±</button>
      <button class="equals" data-key="=" aria-label="계산하기">=</button>
    </div>
    <footer>작은 계산부터, 하나씩.</footer>
  </main>
  <script>
    // 계산 상태를 화면과 분리해 브라우저 없이도 테스트합니다.
    class Calculator {
      constructor() { this.clear(); }
      clear() {
        this.display = '0'; this.left = null; this.operator = null;
        this.fresh = true; this.error = '';
      }
      press(key) {
        if (key === 'C') { this.clear(); return; }
        if (/^[0-9.]$/.test(key)) {
          if (this.error) this.clear();
          if (this.fresh) { this.display = '0'; this.fresh = false; }
          if (key === '.') {
            if (!this.display.includes('.')) this.display += '.';
          } else if (this.display.replace(/[-.]/g, '').length < 12) {
            this.display = this.display === '0' ? key
              : this.display === '-0' ? '-' + key : this.display + key;
          }
          return;
        }
        if (this.error) return;
        if (key === 'backspace') {
          if (!this.fresh) {
            this.display = this.display.slice(0, -1);
            if (!this.display || this.display === '-') this.display = '0';
          }
        } else if (key === 'sign') {
          if (this.fresh && this.operator) { this.display = '0'; this.fresh = false; }
          this.display = this.display.startsWith('-') ? this.display.slice(1) : '-' + this.display;
        } else if (['+', '-', '×', '÷'].includes(key)) {
          if (this.operator && !this.fresh) this.calculate();
          if (this.error) return;
          this.left = Number(this.display); this.operator = key; this.fresh = true;
        } else if (key === '=') {
          if (this.operator && !this.fresh) this.calculate();
        }
      }
      calculate() {
        const right = Number(this.display);
        if (this.operator === '÷' && right === 0) {
          this.fail('0으로 나눌 수 없습니다. C 또는 숫자를 눌러 다시 시작하세요.');
          return;
        }
        let result;
        switch (this.operator) {
          case '+': result = this.left + right; break;
          case '-': result = this.left - right; break;
          case '×': result = this.left * right; break;
          case '÷': result = this.left / right; break;
        }
        if (!Number.isFinite(result)) {
          this.fail('계산 범위를 벗어났습니다. C 또는 숫자를 눌러 다시 시작하세요.');
          return;
        }
        // 소수 계산의 미세한 오차를 줄이고 유효숫자 12자리로 표시합니다.
        this.display = String(Number(result.toPrecision(12)));
        this.left = null; this.operator = null; this.fresh = true;
      }
      fail(message) {
        this.clear(); this.display = '오류'; this.error = message;
      }
    }

    if (typeof document !== 'undefined') {
      const calculator = new Calculator();
      const display = document.getElementById('display');
      const expression = document.getElementById('expression');
      const message = document.getElementById('message');
      const press = (key) => {
        calculator.press(key);
        display.textContent = calculator.display;
        expression.textContent = calculator.operator
          ? `${calculator.left} ${calculator.operator}` : '';
        message.textContent = calculator.error || (calculator.operator
          ? '다음 숫자를 입력하고 =를 누르세요.'
          : '숫자 → 연산 → 숫자 → = 순서로 눌러 보세요.');
        message.classList.toggle('error', Boolean(calculator.error));
      };
      document.querySelectorAll('[data-key]').forEach((button) => {
        button.addEventListener('click', () => press(button.dataset.key));
      });
      document.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        // 버튼에 포커스가 있을 때 Enter는 기본 클릭 동작을 사용합니다.
        if (event.key === 'Enter' && event.target.tagName === 'BUTTON') return;
        const aliases = { Enter: '=', Escape: 'C', Backspace: 'backspace',
          '*': '×', '/': '÷', c: 'C', C: 'C' };
        const key = aliases[event.key] || event.key;
        if (/^[0-9.+\-=]$/.test(key) || Object.values(aliases).includes(key)) {
          event.preventDefault(); press(key);
        }
      });
    }
  </script>
</body>
</html>
